# Mtrini free-model relay (Cloudflare Workers, free plan).
# Deploy: npx wrangler login, npx wrangler secret put HEABSY_KEY, npx wrangler deploy
name = "mtrini-free"
main = "src/worker.js"
compatibility_date = "2026-10-01"

[[durable_objects.bindings]]
name = "LIMITER"
class_name = "LimiterObject"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["LimiterObject"]

# Limits and prices (USD). Change them here and run `npx wrangler deploy` again.
[vars]
UPSTREAM_URL = "https://api.heabsy.com/v1"
MODEL = "qwen38"
PRICE_INPUT_PER_M = "1.00"
PRICE_CACHED_PER_M = "0.0761"
PRICE_OUTPUT_PER_M = "3.00"
USER_DAILY_USD = "0.10"
IP_DAILY_USD = "0.30"
GLOBAL_DAILY_USD = "1.60"
USER_RPM = "10"
GLOBAL_RPM = "50"
USER_CONCURRENCY = "2"
GLOBAL_CONCURRENCY = "8"
MAX_TOKENS = "8192"
MAX_BODY_BYTES = "300000"
UPGRADE_URL = "https://platform.heabsy.com/r/mtrini"
