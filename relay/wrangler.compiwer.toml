# Compiwer Free: Grok 4.7 through 100miliongrok (free, OpenAI-compatible), for Mtrini Workspace.
# Same code as the Heabsy relay (wrangler.toml); only these settings differ.
# Deploy: npx wrangler deploy -c wrangler.compiwer.toml
# Key(s): put them in the secret UPSTREAM_KEYS, commas or new lines between them (see README.md).
name = "compiwer-free"
main = "src/worker.js"
compatibility_date = "2026-10-01"

[[durable_objects.bindings]]
name = "LIMITER"
class_name = "LimiterObject"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["LimiterObject"]

[vars]
SERVICE = "compiwer-free"
UPSTREAM_URL = "https://100miliongrok.top/v1"
MODEL = "grok-4.7"
OWNER = "compiwer"
# The upstream is free but token-counted, so every token is priced at 1.00 per million:
# the *_USD limits below then read as millions of tokens.
PRICE_INPUT_PER_M = "1.00"
PRICE_CACHED_PER_M = "1.00"
PRICE_OUTPUT_PER_M = "1.00"
USER_DAILY_USD = "10"      # 10M tokens per install per day
IP_DAILY_USD = "25"        # 25M tokens per IP address per day
GLOBAL_DAILY_USD = "500"   # 500M tokens per day for everyone (~3.5B a week, well under the 20B weekly allowance)
USER_RPM = "12"
GLOBAL_RPM = "120"
USER_CONCURRENCY = "2"
GLOBAL_CONCURRENCY = "5"   # the upstream allows 5 requests at once per account
MAX_TOKENS = "16384"
MAX_BODY_BYTES = "600000"
UPGRADE_URL = ""           # no "add your own key" line: Compiwer Free has no paid upgrade
UPGRADE_NAME = ""
