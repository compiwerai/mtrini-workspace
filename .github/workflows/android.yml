name: android
# Builds the Android app (Capacitor) as an APK. Runs on release tags, on demand, and on pushes to android-*
# branches; on a tag it also attaches the APK to that GitHub release. The APK is debug-signed for now
# (install it by allowing "unknown apps"); a release keystore comes with the Google Play listing.
on:
  push:
    tags: ['v*']
    branches: ['android-*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      # the ubuntu runner already ships the Android SDK (ANDROID_HOME); Gradle fetches any missing platform
      - name: Build the interface
        run: |
          npm ci
          npm run build
      - name: Copy it into the Android project
        run: npx cap sync android
      - name: Build the APK
        working-directory: frontend/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      - name: Name the APK
        run: |
          VERSION=$(node -p "require('./package.json').version")
          mkdir -p ../installer
          cp android/app/build/outputs/apk/debug/app-debug.apk "../installer/MtriniWorkspace-${VERSION}-android.apk"
          (cd ../installer && sha256sum "MtriniWorkspace-${VERSION}-android.apk" > "MtriniWorkspace-${VERSION}-android.apk.sha256")
      - uses: actions/upload-artifact@v4
        with:
          name: mtrini-workspace-android
          path: installer/*android*
      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/v')
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${GITHUB_REF_NAME}" installer/*android* --clobber
