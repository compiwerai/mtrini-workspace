name: android-standalone
# Builds a standalone Mtrini Android app: local chat sessions and the two free
# Compiwer models, with no PC bridge and no API key. On demand; attaches to a
# release tag if one is pushed.
on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }

      - name: Put the standalone app into the Android assets
        run: |
          cp frontend/standalone/index.html frontend/standalone/logo.png frontend/android/app/src/main/assets/public/
          sed -i 's/name="app_name">Mtrini</name="app_name">Mtrini Standalone</' frontend/android/app/src/main/res/values/strings.xml
          sed -i 's/name="title_activity_main">Mtrini</name="title_activity_main">Mtrini Standalone</' frontend/android/app/src/main/res/values/strings.xml

      - name: Build the APK
        working-directory: frontend/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Name the APK
        run: |
          VERSION=$(node -p "require('./package.json').version")
          mkdir -p installer
          cp frontend/android/app/build/outputs/apk/debug/app-debug.apk "installer/MtriniWorkspace-Standalone-${VERSION}-android.apk"
          (cd installer && sha256sum "MtriniWorkspace-Standalone-${VERSION}-android.apk" > "MtriniWorkspace-Standalone-${VERSION}-android.apk.sha256")

      - uses: actions/upload-artifact@v4
        with:
          name: mtrini-workspace-android-standalone
          path: installer/*standalone*

      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${GITHUB_REF_NAME}" installer/*standalone* --clobber
