name: windows
# Builds the Windows app and installer (MtriniWorkspace-Setup-<version>.exe) on GitHub's machines.
# Runs on release tags and on demand; on a tag it attaches the installer and its .sha256 (which the
# auto-updater checks) to that GitHub release.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          npm ci --prefix frontend
      - name: Build the app (and smoke-test it)
        shell: pwsh
        run: ./scripts/build-exe.ps1
      - name: Check the bundle
        shell: pwsh
        run: |
          # A half-collected zstandard (its folder without its Python code) once broke every model request.
          $bad = Get-ChildItem dist\MtriniWorkspace -Recurse -Directory -Filter zstandard
          if ($bad) { throw "zstandard was bundled: $($bad.FullName)" }
      - name: Build the installer
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" scripts\setup.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed" }
          Get-ChildItem installer\*.exe | ForEach-Object {
            $h = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$h  $($_.Name)" | Out-File -Encoding ascii -NoNewline "$($_.FullName).sha256"
          }
      - uses: actions/upload-artifact@v4
        with:
          name: mtrini-workspace-windows
          path: installer/*
      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for ($i = 0; $i -lt 20; $i++) {
            gh release view $env:GITHUB_REF_NAME *> $null
            if ($LASTEXITCODE -eq 0) { break }
            Start-Sleep -Seconds 30
          }
          gh release upload $env:GITHUB_REF_NAME (Get-ChildItem installer\* | ForEach-Object FullName) --clobber
