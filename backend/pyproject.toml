[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mtrini-workspace-backend"
version = "0.6.1"
description = "Mtrini Workspace backend — agent engine, providers, tools, model manager"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "httpx>=0.27",
  "huggingface-hub>=0.23",
  "keyring>=25",
  "python-multipart>=0.0.9",
  "sse-starlette>=2.1",
  "click>=8.1",
  "pywebview>=5",
]

[project.scripts]
mtrini = "mtrini.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501", "E741"]
